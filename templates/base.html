{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Product Assistant{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'product_list' %}">Product Assistant</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
          <a class="nav-link" href="{% url 'product_list' %}">Catalog</a>
          <a class="nav-link" href="{% url 'product_create' %}">Add product</a>
        </div>
      </div>
    </nav>
    <main class="container py-4 py-md-5">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mb-4" role="status">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
